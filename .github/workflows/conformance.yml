name: Conformance
on: { workflow_dispatch: {}, pull_request: {}, push: { branches: [main] } }

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  t0:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, host: macos-arm64 }
          - { os: ubuntu-22.04, host: linux-x64 }
          - { os: windows-2025, host: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.10.0 }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: actions/setup-python@v6
        with: { python-version-file: .python-version }
      - uses: actions/setup-dotnet@v5
        with: { global-json-file: global.json }
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.9.28" }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm check
      - name: Run T0 conformance
        run: node scripts/run-t0.mjs --host ${{ matrix.host }} --output artifacts/conformance/${{ matrix.host }}.json
      - name: Attest T0 result provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4.2.2
        with:
          subject-path: artifacts/conformance/${{ matrix.host }}.json
      - name: Retain T0 result
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mgds-t0-${{ matrix.host }}
          path: artifacts/conformance/${{ matrix.host }}.json
          if-no-files-found: error
          retention-days: 30
