name: Conformance
on: { workflow_dispatch: {}, pull_request: {}, push: { branches: [main] } }
jobs:
  t0:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, host: macos-arm64 }
          - { os: ubuntu-22.04, host: linux-x64 }
          - { os: windows-2025, host: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.10.0 }
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: actions/setup-python@v6
        with: { python-version-file: .python-version }
      - uses: actions/setup-dotnet@v5
        with: { global-json-file: global.json }
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.9.28" }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm check
      - run: node scripts/run-t0.mjs --host ${{ matrix.host }} --output artifacts/conformance/${{ matrix.host }}.json
