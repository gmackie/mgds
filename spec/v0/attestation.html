<!doctype html><html lang="en"><meta charset="utf-8"><title>MGDS Attestation</title><body><main><h1>Attestation v0</h1><p>MGDS attestations sign canonical JSON containing the run identity, sealed inputs, event-ledger head, evaluator identity, and artifact hashes using Ed25519. Missing events, substituted evaluators, or altered inputs invalidate verification.</p></main></body></html>
