<!doctype html><html lang="en"><meta charset="utf-8"><title>MGDS T0 Conformance</title><body><main><h1>MGDS T0 Conformance</h1><p>T0 reports manifest discovery, bounded output, cancellation, privacy, and evidence integrity as independent clauses. A policy or integrity failure invalidates the run; scores are never averaged across failed clauses.</p></main></body></html>
